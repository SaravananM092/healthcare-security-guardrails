name: Healthcare Container Security Scan

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  container-security-scan:
    name: Container Image Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build healthcare container image
        run: |
          docker build -t healthcare-app:security-test .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'healthcare-app:security-test'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: false
