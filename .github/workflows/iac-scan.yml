name: Healthcare IaC Security Scan

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  iac-security-scan:
    name: IaC Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov IaC Scanner
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          soft_fail: true
